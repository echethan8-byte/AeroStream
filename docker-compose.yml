name: flight-monitoring

x-flink-env: &flink-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flight_analytics}
  POSTGRES_USER: ${POSTGRES_USER:-flight}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flight_pw}
  AIRPORT_CODE: ${AIRPORT_CODE:-BLR}
  TERMINAL_RADIUS_DEG: ${TERMINAL_RADIUS_DEG:-0.25}
  CAPACITY_MOVEMENTS_PER_HOUR: ${CAPACITY_MOVEMENTS_PER_HOUR:-40}
  PYTHONPATH: /opt/project

x-flink-properties: &flink-properties |
  jobmanager.rpc.address: flink-jobmanager
  taskmanager.numberOfTaskSlots: 8
  env.java.opts.all: -Duser.timezone=UTC
  state.checkpoints.dir: file:///tmp/flink-checkpoints
  rest.flamegraph.enabled: false

x-producer: &producer
  build:
    context: .
    dockerfile: Dockerfile.producers
  env_file: .env
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  depends_on:
    kafka-init:
      condition: service_completed_successfully
  restart: unless-stopped
  profiles: ["producers"]

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["/bin/bash", "/create_topics.sh"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flight_pw}
      POSTGRES_DB: ${POSTGRES_DB:-flight_analytics}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/00_create_superset_db.sql:/docker-entrypoint-initdb.d/00_create_superset_db.sql:ro
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flight} -d ${POSTGRES_DB:-flight_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 12

  flink-jobmanager:
    build: ./flink
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      <<: *flink-env
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - .:/opt/project:ro
      - flink-checkpoints:/tmp/flink-checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  flink-taskmanager:
    build: ./flink
    container_name: flink-taskmanager
    command: taskmanager
    environment:
      <<: *flink-env
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - .:/opt/project:ro
      - flink-checkpoints:/tmp/flink-checkpoints
    depends_on:
      - flink-jobmanager

  superset:
    build: ./superset
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      POSTGRES_USER: ${POSTGRES_USER:-flight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flight_pw}
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin --username "${SUPERSET_ADMIN_USER:-admin}" --password "${SUPERSET_ADMIN_PASSWORD:-admin}" --firstname Admin --lastname User --email admin@example.com || true
        superset init &&
        /usr/bin/run-server.sh

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: flight-dashboard
    ports:
      - "8050:8050"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-flight_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-flight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flight_pw}
      AIRPORT_CODE: ${AIRPORT_CODE:-BLR}
      TERMINAL_RADIUS_DEG: ${TERMINAL_RADIUS_DEG:-0.25}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional: run the three producers in containers instead of on the host
  #   docker compose --profile producers up -d --build
  flight-producer:
    <<: *producer
    container_name: flight-producer
    command: ["python", "-m", "producers.flight_producer"]

  schedule-producer:
    <<: *producer
    container_name: schedule-producer
    command: ["python", "-m", "producers.schedule_producer"]

  weather-producer:
    <<: *producer
    container_name: weather-producer
    command: ["python", "-m", "producers.weather_producer"]

volumes:
  kafka-data:
  postgres-data:
  flink-checkpoints:
